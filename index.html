<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c6a53" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1412" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finansai">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Family Finances 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a household ledger app — sticky header with fiscal-period switcher, tab rail, one working surface per tab. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --surface-2:#e9eeeb; --fg:#111a16; --muted:#5b6a64; --faint:#8a9792; --line:#d8e0dc;
  --accent:#1c6a53; --accent-fg:#ffffff; --accent-soft:#d9ebe3; --accent-ink:#165542;
  --good:#0ca30c; --good-ink:#17803a; --warn:#fab219; --warn-ink:#8a5b00; --crit:#d03b3b; --crit-ink:#b42e2e;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6;
  --shadow:0 1px 2px rgba(17,26,22,.06),0 4px 16px rgba(17,26,22,.05);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#161d1a; --surface-2:#1f2824; --fg:#e7eeea; --muted:#9caaa4; --faint:#6f7d77; --line:#2a3531;
  --accent:#52b391; --accent-fg:#08130f; --accent-soft:#1b3229; --accent-ink:#7fd0b2;
  --good-ink:#4cc76a; --warn-ink:#f2bb48; --crit-ink:#ee7a7a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#161d1a; --surface-2:#1f2824; --fg:#e7eeea; --muted:#9caaa4; --faint:#6f7d77; --line:#2a3531;
  --accent:#52b391; --accent-fg:#08130f; --accent-soft:#1b3229; --accent-ink:#7fd0b2;
  --good-ink:#4cc76a; --warn-ink:#f2bb48; --crit-ink:#ee7a7a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:12px 8px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.brand h1{font-size:1.15rem;font-weight:700}
.brand small{color:var(--muted);font-size:.78rem}
.period{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:3px}
.period button{border:0;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.period button:hover{background:var(--surface);color:var(--fg)}
.period .lbl{font-weight:600;font-size:.88rem;min-width:118px;text-align:center;line-height:1.1}
.period .lbl span{display:block;font-size:.68rem;color:var(--muted);font-weight:400;font-family:var(--f-mono)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.82rem;color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--faint)}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;font-size:.9rem;white-space:nowrap;border-bottom:2px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs button .dot{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:.7rem;line-height:18px;text-align:center;margin-left:4px;font-family:var(--f-mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:18px 64px}
section.view{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.g2.keep{grid-template-columns:repeat(2,minmax(0,1fr))}.g2:not(.keep){grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-h p{margin:0;color:var(--muted);font-size:.8rem}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.78rem;color:var(--muted)}
.hero{background:var(--accent);color:var(--accent-fg);border-radius:var(--r);padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.hero .eyebrow{color:inherit;opacity:.8}
.hero .big{font-family:var(--f-display);font-size:clamp(2rem,6vw,2.9rem);font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.hero .sub{opacity:.85;font-size:.85rem;margin-top:6px}
.hero .side{text-align:right;font-size:.82rem;opacity:.9;display:flex;flex-direction:column;gap:2px}
.hero .side b{font-family:var(--f-mono);font-weight:500}
.hero{align-items:center}
.spark{display:flex;flex-direction:column;gap:4px;border:0;background:none;padding:8px 0 0;width:100%;cursor:pointer;text-align:left;border-top:1px solid var(--line)}
.spark:hover .eyebrow{color:var(--accent-ink)}
.hledger{display:flex;flex-direction:column;gap:3px;font-size:.84rem;min-width:280px;background:color-mix(in srgb,var(--accent-fg) 10%,transparent);border-radius:8px;padding:10px 12px}
.hledger .hl{display:flex;justify-content:space-between;gap:16px}
.hledger .hl span{opacity:.85}
.hledger .hl b{font-family:var(--f-mono);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.hledger .hl.tot{border-top:1px solid color-mix(in srgb,var(--accent-fg) 35%,transparent);padding-top:4px;margin-bottom:4px}
.hledger .hl.tot span{opacity:1;font-weight:600}
.hero .sub b{font-family:var(--f-mono);font-weight:500}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}.hledger{min-width:0}}

.pos{color:var(--good-ink)} .neg{color:var(--crit-ink)} .mut{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-ink)}
.pill.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn-ink)}
.pill.crit{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit-ink)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500;font-size:.88rem;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent-ink)}
.btn.sm{padding:6px 10px;font-size:.8rem}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* progress bars */
.bars{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;align-items:center;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.brow:first-child{border-top:0}
.brow:hover .bname{color:var(--accent-ink)}
.bname{display:flex;align-items:center;gap:8px;font-weight:500;font-size:.9rem;min-width:0}
.bname span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bval{font-family:var(--f-mono);font-size:.82rem;white-space:nowrap;text-align:right}
.bval .of{color:var(--muted)}
.track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.track i.over{background:var(--crit)!important}
.track .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.35}
.sub-rows{grid-column:1/-1;display:flex;flex-direction:column;gap:2px;padding:6px 0 2px 18px}
.subr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.85rem;border:0;background:none;text-align:left;width:100%}
.subr:hover{background:var(--surface-2)}
.subr .track{height:5px}

/* lists */
.tx{display:flex;flex-direction:column}
.txr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;padding:10px 4px;border-top:1px solid var(--line);align-items:center}
.txr:first-child{border-top:0}
.txr .d{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);width:44px;line-height:1.2;text-align:center}
.txr .d b{display:block;font-size:1rem;color:var(--fg);font-weight:500}
.txr .m{min-width:0}
.txr .v1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txr .v2{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.txr .a{font-family:var(--f-mono);font-size:.9rem;text-align:right;white-space:nowrap}
.daysep{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 4px 4px}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:.78rem;font-weight:600;color:var(--muted);min-width:0}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;font-size:.95rem;min-width:0}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.amount-inp{font-family:var(--f-display);font-size:1.8rem;font-weight:600;padding:10px 14px 10px 64px;letter-spacing:-.02em}
.amt-wrap{position:relative;display:block}
.amt-sign{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-family:var(--f-display);font-size:1.5rem;font-weight:600;pointer-events:none}
.amt-wrap.exp .amt-sign{color:var(--crit-ink)} .amt-wrap.inc .amt-sign{color:var(--good-ink)}
.bt td.cat{padding-left:22px}
.bt tr.grp td{background:var(--surface-2);font-weight:600;font-size:.82rem}
.bt tr.grp td:first-child{border-radius:6px 0 0 6px} .bt tr.grp td:last-child{border-radius:0 6px 6px 0}
.bt input.inp{width:100px;text-align:right;font-family:var(--f-mono)}
.bt .hint{display:block;font-size:.7rem;color:var(--muted);font-weight:400}
.bt .warnc{color:var(--warn-ink)}
.sticky-save{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow)}
.sticky-save .btn{border-color:transparent}
.sticky-save .btn.ghost{color:var(--bg)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:500;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.8rem;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.note{font-size:.8rem;color:var(--muted);margin:0}

/* tables */
.tscroll{overflow-x:auto;margin-inline:-4px}
table.t{width:100%;border-collapse:collapse;font-size:.86rem}
table.t th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
table.t .inp{padding:7px 8px;font-size:.86rem}
table.t tr.off td{opacity:.55}

/* alerts / states */
.banner{border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--surface)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 60%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.banner.crit{border-color:color-mix(in srgb,var(--crit) 50%,var(--line));background:color-mix(in srgb,var(--crit) 7%,var(--surface))}
.banner.good{border-color:color-mix(in srgb,var(--good) 45%,var(--line));background:color-mix(in srgb,var(--good) 7%,var(--surface))}
.banner .bi{flex:none;margin-top:2px}
.banner .bb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.banner p{margin:0;font-size:.86rem}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.4s infinite;border-radius:6px;height:14px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel,.iconbtn.spin svg{animation:none}}

.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover{fill:var(--fg);fill-opacity:.04}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--fg);color:var(--bg);font-size:.78rem;padding:7px 9px;border-radius:7px;max-width:260px;line-height:1.35;box-shadow:var(--shadow)}
#tip b{font-family:var(--f-mono);font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.86rem;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.insight{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.insight:first-child{border-top:0}
.insight .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:.8rem;font-weight:700;font-family:var(--f-mono)}
.insight .ic.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-ink)}
.insight .ic.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn-ink)}
.insight .ic.crit{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit-ink)}
.insight .ic.info{background:var(--accent-soft);color:var(--accent-ink)}
.insight b{font-weight:600;font-size:.9rem}
.insight p{margin:0;font-size:.84rem;color:var(--muted);grid-column:2}
.ai-out{font-size:.88rem;line-height:1.55;white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:12px 14px}
.recon-diff{font-family:var(--f-display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--f-mono)}
.kv .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:600;color:var(--fg)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><h1>Family Finances 2026</h1><small id="sync">Connecting to Google Sheets…</small></div>
      <div class="period" role="group" aria-label="Financial month">
        <button id="pPrev" aria-label="Previous financial month"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="lbl" id="pLbl">—<span>10th → 9th</span></div>
        <button id="pNext" aria-label="Next financial month"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <button class="iconbtn" id="refresh" aria-label="Reload from Google Sheets"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Refresh</span></button>

const LT_MONTHS = ['Sausis','Vasaris','Kovas','Balandis','Geguze','Birzelis','Liepa','Rugpjutis','Rugsejis','Spalis','Lapkritis','Gruodis'];
function colName(i){ let s = ''; i++; while (i){ const m = (i-1) % 26; s = String.fromCharCode(65+m) + s; i = Math.floor((i-1)/26); } return s; }
// Seimos Biudzetas: one row per month (Lithuanian month name in column A); row 3 holds income / group headers, row 4 the expense sub-categories.
function parseBudgetSheet(rows){
  const r3 = rows[2] || [], r4 = rows[3] || [];
  const width = Math.max(r3.length, r4.length);
  const cols = [];
  for (let c = 1; c < width; c++){
    const sub = String(r4[c] || '').trim(), top = String(r3[c] || '').trim();
    if (sub){ if (!/total:?$/i.test(sub)) cols.push({c, cat: sub, kind: 'exp'}); }
    else if (INCOME_CATS.includes(top)) cols.push({c, cat: top, kind: 'inc'});

  }

  rows.forEach((r, i) => {
    const m = String(r[0] || '').trim().match(/^([A-Za-z]+),\s*(\d{4})/); if (!m) return;

// ---------- analysis ----------
function txIn(pk){ return S.txns.filter(t => t.pk === pk); }
function agg(pk){
  const a = {pk, income:0, outflow:0, savings:0, spend:0, net:0, byCat:{}, byGroup:{}, incByCat:{}, n:0};
  GROUPS.forEach(g => a.byGroup[g.id] = 0);
  for (const t of S.txns){ if (t.pk !== pk) continue; a.n++;
    if (t.type === 'Pajamos'){ a.income += t.amt; a.incByCat[t.cat] = (a.incByCat[t.cat]||0) + t.amt; continue; }
    const v = -t.amt; a.outflow += v;
    if (t.cat === SAVINGS){ a.savings += v; continue; }
    a.byCat[t.cat] = (a.byCat[t.cat]||0) + v; a.byGroup[groupOf(t.cat)] += v; }
  a.spend = a.outflow - a.savings; a.net = a.income - a.outflow; a.surplus = a.income - a.spend;
  a.variable = GROUPS.filter(g => VARIABLE.has(g.id)).reduce((s,g) => s + a.byGroup[g.id], 0);
  return a;
}
function allPks(){ const s = new Set(S.txns.map(t => t.pk)); s.add(curPk()); return [...s].sort(); }
const curPk = () => pkFromDate(ymd(new Date()));
function budgetFor(pk){
  const B = S.bsheet; if (!B) return null;
  let p = pk; for (let k = 0; k < 3; k++){ const m = B.months[p]; if (m && m.filled) return {map: m.vals, src: p}; p = pShift(p, -1); }
  return {map: {}, src: null};
}
function projection(pk){
  const a = agg(pk), b = budgetFor(pk); if (!b) return null;
  let remainingExp = 0, expInc = 0, remainingSav = 0;
  for (const [cat, bud] of Object.entries(b.map)){
    if (INCOME_CATS.includes(cat)){ expInc += Math.max(0, bud - (a.incByCat[cat]||0)); continue; }
    if (cat === SAVINGS){ remainingSav += Math.max(0, bud - a.savings); continue; }
    remainingExp += Math.max(0, bud - (a.byCat[cat]||0));
  }
  const isCur = pk === curPk();
  const projIncome = a.income + (isCur ? expInc : 0), projSpend = a.spend + (isCur ? remainingExp : 0);
  const projSurplus = projIncome - projSpend, projSav = a.savings + (isCur ? remainingSav : 0);
  // projNet = what is still in the joint account at month end, i.e. the amount to move on the 10th
  return {projIncome, projSpend, projOut: projSpend + projSav, projSurplus, projSav, projNet: projSurplus - projSav, remainingExp, expInc};
}
function varRemaining(pk){
  const a = agg(pk), b = budgetFor(pk); if (!b) return null;
  let rem = 0, bud = 0;
  for (const [cat, v] of Object.entries(b.map)){ if (INCOME_CATS.includes(cat) || cat === SAVINGS) continue; if (!VARIABLE.has(groupOf(cat))) continue; bud += v; rem += v - (a.byCat[cat]||0); }
  return {budget: bud, remaining: rem, spent: a.variable};
}

function insights(){
  const out = []; const pk = S.pk, cur = curPk(), a = agg(pk), b = budgetFor(pk);
  const prevs = allPks().filter(p => p < pk && p < cur).slice(-6); const pa = prevs.map(agg);
  // 1 projection
  const proj = projection(pk);
  if (proj && pk === cur){ const t = proj.projSurplus >= 0 ? 'good' : 'crit'; out.push({tone:t, title: proj.projSurplus >= 0 ? 'On track to save ' + fmtE0(proj.projSurplus) + ' this month' : 'Heading for a ' + fmtE0(-proj.projSurplus) + ' shortfall', body:'If the rest of ' + esc(MONTHS[pParts(pk)[1]-1]) + ' follows the budget, ' + fmtE0(proj.projIncome) + ' comes in and ' + fmtE0(proj.projSpend) + ' is spent. ' + fmtE0(proj.projSav) + ' goes to Seimos Santaupos as planned transfers, leaving about ' + fmtE0(Math.max(0, proj.projNet)) + ' to move on ' + shortD(pStart(pShift(pk,1))) + '.'}); }
  // 2 pace vs history
  if (pa.length && pk === cur){ const di = dayIdx(pk, ymd(new Date())); const cum = p => S.txns.filter(t => t.pk === p && t.type === 'Islaidos' && VARIABLE.has(groupOf(t.cat)) && t.cat !== SAVINGS && dayIdx(p, t.date) <= di).reduce((s,t) => s - t.amt, 0);
    const now = cum(pk), hist = prevs.map(cum).reduce((s,v) => s+v, 0) / prevs.length; if (hist > 0){ const d = (now - hist) / hist; out.push({tone: d > .15 ? 'warn' : d < -.1 ? 'good' : 'info', title: 'Variable spending ' + (Math.abs(d) < .05 ? 'on a normal pace' : Math.round(Math.abs(d)*100) + '% ' + (d > 0 ? 'ahead of' : 'below') + ' usual'), body: fmtE0(now) + ' by day ' + (di+1) + ', against an average of ' + fmtE0(hist) + ' at the same point in the previous ' + prevs.length + ' months.'}); } }
  // 3 over budget
  if (b){ const over = Object.entries(b.map).filter(([c]) => !INCOME_CATS.includes(c) && c !== SAVINGS).map(([c,v]) => ({c, v, act: a.byCat[c]||0})).filter(x => x.act > x.v + 1).sort((x,y) => (y.act-y.v) - (x.act-x.v));
    const unb = Object.entries(a.byCat).filter(([c,v]) => v > 1 && !b.map[c]).sort((x,y) => y[1]-x[1]);
    if (over.length) out.push({tone:'crit', title: over.length + ' ' + (over.length === 1 ? 'category is' : 'categories are') + ' over budget', body: over.slice(0,4).map(x => esc(x.c) + ' ' + fmtE0(x.act) + ' of ' + fmtE0(x.v)).join(' · ')});
    if (unb.length) out.push({tone:'warn', title:'Spending without a budget line', body: unb.slice(0,4).map(([c,v]) => esc(c) + ' ' + fmtE0(v)).join(' · ') + '. Add these to the month’s budget tab so the plan matches reality.'}); }
  // 4 biggest change vs average
  if (pa.length >= 2){ const cats = new Set(pa.flatMap(x => Object.keys(x.byCat))); let best = null;
    cats.forEach(c => { const av = pa.reduce((s,x) => s + (x.byCat[c]||0), 0) / pa.length; const v = a.byCat[c] || 0; const d = v - av; if (groupOf(c) === 'pers' || groupOf(c) === 'fix') return; if (!best || Math.abs(d) > Math.abs(best.d)) best = {c, d, av, v}; });
    if (best && Math.abs(best.d) > 40) out.push({tone: best.d > 0 ? 'warn' : 'good', title: esc(best.c) + ' ' + (best.d > 0 ? 'up' : 'down') + ' ' + fmtE0(Math.abs(best.d)) + ' vs average', body: fmtE0(best.v) + ' in ' + esc(pLabel(pk)) + ' against a ' + fmtE0(best.av) + ' monthly average.' + (pk === cur ? ' The month is not finished yet.' : '')}); }
  // 5 groceries frequency
  const groc = txIn(pk).filter(t => t.cat === 'Maistas' && t.amt < 0); const prevG = prevs.map(p => txIn(p).filter(t => t.cat === 'Maistas' && t.amt < 0));
  if (groc.length && prevG.length){ const avgN = prevG.reduce((s,l) => s + l.length, 0) / prevG.length; const avgTicket = prevG.flat().reduce((s,t) => s - t.amt, 0) / Math.max(1, prevG.flat().length); const small = prevG.flat().filter(t => -t.amt < 10).length / Math.max(1, prevG.flat().length);
    out.push({tone:'info', title: 'Groceries: ' + Math.round(avgN) + ' shops a month, ' + fmtE(avgTicket) + ' average basket', body: Math.round(small*100) + '% of food purchases are under €10. Fewer, planned shops usually cut impulse spend. This month so far: ' + groc.length + ' shops, ' + fmtE0(groc.reduce((s,t) => s - t.amt, 0)) + '.'}); }
  // 6 savings rate trend
  const comp = allPks().filter(p => p < cur).slice(-6).map(agg).filter(x => x.income > 0);
  if (comp.length){ const r = comp.map(x => x.surplus / x.income); const avg = r.reduce((s,v) => s+v, 0) / r.length; out.push({tone: avg >= .2 ? 'good' : 'warn', title: 'Saving ' + Math.round(avg*100) + '% of income on average', body: 'Across ' + comp.length + ' completed months, measured as income minus spending, whether or not it has been moved to Seimos Santaupos yet. Range: ' + Math.round(Math.min(...r)*100) + '%–' + Math.round(Math.max(...r)*100) + '%.'}); }
  // 7 pet costs
  const mozza = allPks().slice(-6).map(p => agg(p).byCat['Mozza'] || 0); const mz = mozza.reduce((s,v) => s+v, 0);
  if (mz > 200){ const vet = S.txns.filter(t => t.cat === 'Mozza' && /vet/i.test(t.vendor)).reduce((s,t) => s - t.amt, 0); if (vet > 100) out.push({tone:'info', title:'Mozza: ' + fmtE0(mz) + ' in 6 months', body: fmtE0(vet) + ' of that was vet bills, booked under Mozza (Isgyvenimo). The Veterinaras category under Nenumatytos keeps one-off vet costs out of the routine living budget.'}); }
  return out.slice(0, 7);
}

// Confirmed balance = the last value typed in from Revolut (Santaupos tab). Since then, every
// "Atsideta i seimos saskaita" row in Transakcijos moves money in (negative amount) or out (positive amount).
function savingsState(){
  const snaps = S.snaps || [], last = snaps.length ? snaps[snaps.length - 1] : null;
  const interest = snaps.reduce((s, x) => s + (x.exp == null ? 0 : x.diff), 0);
  if (!last){ const contrib = S.txns.filter(t => t.cat === SAVINGS).reduce((s, t) => s - t.amt, 0); return {known: false, contrib, interest}; }
  const after = S.txns.filter(t => t.cat === SAVINGS && t.row > last.upto);
  const inS = after.filter(t => t.amt < 0).reduce((s, t) => s - t.amt, 0), outS = after.filter(t => t.amt > 0).reduce((s, t) => s + t.amt, 0);
  return {known: true, base: last.bal, baseWhen: last.when, inS, outS, now: last.bal + inS - outS, interest, after};
}

// Balance history: rebuilt from the savings movements in Transakcijos, anchored on the confirmed balances.
function savingsTimeline(){
  const moves = S.txns.filter(t => t.cat === SAVINGS).slice().sort((a, b) => a.date.localeCompare(b.date) || a.row - b.row);
  const snaps = (S.snaps || []).map(x => ({...x, date: normDate(String(x.when).slice(0, 10)) || ymd(new Date())})).sort((a, b) => a.date.localeCompare(b.date));
  let start, est = false;
  const netUpTo = d => moves.filter(t => t.date <= d).reduce((s, t) => s - t.amt, 0);
  // An opening balance (a Santaupos row without an expected value) sets the start; real balance checks after it show up as interest.

    B.cols.forEach(c => { arr[c.c - 1] = Math.round(num(S.bud.draft[c.cat]) * 100) / 100; });
    const pk = S.bud.pk;
    guardedWrite('bud', async () => { await call('update_values', {spreadsheetId: SHEET, range: "'Seimos Biudzetas'!B" + m.row + ':' + colName(B.width - 1) + m.row, values: [arr]}); S.bud.dirty = false; S.bud.draft = null; }, pLabel(pk) + ' budget saved to Seimos Biudzetas');
  }
  else if (act === 'drillVendor'){ S.txf = {pk: S.pk, cat:'', q: t.dataset.v, type:''}; setTab('tx'); }
  else if (act === 'cell'){ S.txf = {pk: t.dataset.pk, cat: t.dataset.cat, q:'', type:''}; setTab('tx'); }
  else if (act === 'pickPk'){ S.pk = t.dataset.pk; ensureBudget(S.pk); hideTip(); render(); }
  else if (act === 'allTx'){ S.txf = {pk: S.pk, cat:'', q:'', type:''}; setTab('tx'); }
  else if (act === 'clearF'){ S.txf = {pk:'', cat:'', q:'', type:''}; render(); }
  else if (act === 'range'){ S.range = +t.dataset.v; render(); }
  else if (act === 'basis'){ S.reconBasis = t.dataset.v; try { localStorage.setItem('ff.basis', S.reconBasis); } catch(e) {} render(); }
  else if (act === 'addType'){ S.add.type = t.dataset.v; S.add.cat = ''; S.add.catTouched = false; render(); }
  else if (act === 'quick'){ S.add.vendor = t.dataset.v; S.add.cat = t.dataset.c; S.add.catTouched = true; render(); const a = $('#aAmt'); a && a.focus(); }
  else if (act === 'clearAdd'){ S.add = {type: S.add.type, amount:'', cat:'', vendor:'', date: ymd(new Date()), note:'', catTouched:false}; render(); }
  else if (act === 'postFixed'){ const cur = curPk(); const rows = fixedStatus(cur).filter(r => !r.tx).map(r => ({date: ymd(pStart(cur)), type: r.f.type, cat: r.f.cat, amt: r.f.type === 'Pajamos' ? r.f.amount : -r.f.amount, note: r.f.note, vendor: r.f.vendor}));
    if (rows.length) guardedWrite('postFixed', () => appendTxns(rows), n => rows.length + ' fixed costs saved to Transakcijos'); }
  else if (act === 'postSurplus'){ const sp = surplusPending(); const v = num($('#spAmt').value); if (!sp || v <= 0){ toast('Enter an amount above zero'); return; }
    guardedWrite('postSurplus', () => appendTxns([{date: ymd(pStart(curPk())), type:'Islaidos', cat: SAVINGS, amt: -v, note:'Menesio perteklius → Seimos Santaupos', vendor:'Seimos Santaupos', periodOverride: pSheetLabel(sp.pk)}]), fmtE(v) + ' transfer recorded for ' + pLabel(sp.pk)); }
  else if (act === 'skipSurplus'){ try { localStorage.setItem('ff.skip.' + pShift(curPk(), -1), '1'); } catch(e) {} render(); }
  else if (act === 'saveRecon'){ const rv = num($('#rcRev').value), cs = num($('#rcCash').value); if (!$('#rcRev').value && !$('#rcCash').value){ toast('Enter the Revolut balance and cash first'); return; }
    const book = S.reconBasis === 'all' ? S.txns.reduce((s,t) => s + t.amt, 0) : agg(curPk()).net; const now = new Date();
    const row = [ymd(now) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()), pSheetLabel(curPk()), rv, cs, Math.round((rv+cs)*100)/100, Math.round(book*100)/100, Math.round((rv+cs-book)*100)/100, ($('#rcNote').value || '') + (S.reconBasis === 'all' ? ' [all-time]' : '')];
    guardedWrite('recon', async () => { if (S.bridge){ await call('append_row', {sheet:'Rekonsiliacija', values: row}); return; } const a = await getValues('Rekonsiliacija!A1:A2000'); const r = Math.max(2, a.length + 1); await call('update_values', {spreadsheetId: SHEET, range: 'Rekonsiliacija!A' + r + ':H' + r, values: [row]}); }, 'Check saved to the Rekonsiliacija tab'); }
  else if (act === 'fxAdd'){ readFxInputs(); S.fx.push({id: 'fx' + Date.now().toString(36), active: true, type: 'Islaidos', cat: 'Komunaliniai', amount: 0, vendor: '', note: ''}); S.fxDirty = true; render(); }
  else if (act === 'fxDel'){ readFxInputs(); S.fx.splice(+t.dataset.i, 1); S.fxDirty = true; render(); }
  else if (act === 'fxReset'){ S.fx = null; S.fxDirty = false; render(); }
  else if (act === 'fxSave'){ readFxInputs(); const bad = S.fx.find(f => !(f.amount > 0) || !f.vendor.trim()); if (bad){ toast('Every fixed cost needs a vendor and an amount above zero'); return; }
    const rows = [['ID','Aktyvus','Tipas','Kategorija','Suma','Vendorius','Komentarai'], ...S.fx.map(f => [f.id, !!f.active, INCOME_CATS.includes(f.cat) ? 'Pajamos' : 'Islaidos', f.cat, Math.round(f.amount*100)/100, f.vendor.trim(), f.note || ''])];
    const prevLen = S.fixed.length + 1; while (rows.length < prevLen) rows.push(['','','','','','','']);
    guardedWrite('fx', async () => { await call('update_values', {spreadsheetId: SHEET, range: "'Fiksuotos islaidos'!A1:G" + rows.length, values: rows}); S.fxDirty = false; S.fx = null; }, 'Fixed costs saved to the sheet'); }
  else if (act === 'ai'){ runAI(); }
  else if (act === 'openSavings'){ setTab('savings'); }
  else if (act === 'goWithdraw'){ S.wd = {open: true, amount: '', date: ymd(new Date()), note: ''}; setTab('tx'); }
  else if (act === 'wdOpen'){ S.wd = {open: true, amount: '', date: ymd(new Date()), note: ''}; render(); }
  else if (act === 'wdClose'){ S.wd.open = false; render(); }
  else if (act === 'saveSnap'){
    const raw = $('#svBal').value; const bal = num(raw); if (!raw.trim() || bal < 0){ toast('Enter the balance shown in Revolut'); return; }
    const s = savingsState(), now = new Date(), tl = savingsTimeline(); const expected = s.known ? s.now : (tl ? tl.now : s.contrib); const exp = Math.round(expected * 100) / 100;
    const row = [ymd(now) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()), Math.round(bal * 100) / 100, exp, Math.round((bal - expected) * 100) / 100, maxTxRow(), s.known ? '' : 'Pirmas patikrinimas'];
    guardedWrite('snap', async () => { await appendRowTo('Santaupos', 'F', row); try { await writeSavingsH(bal); } catch(e) {} }, 'Savings balance saved · interest ' + fmtSigned(bal - expected)); }
  else if (act === 'copyLink'){ const inp = $('#shareLink'); try { await navigator.clipboard.writeText(inp.value); toast('Setup link copied'); } catch(_){ inp.focus(); inp.select(); toast('Link selected — copy it from the menu'); } }
  else if (act === 'disconnect'){ if (t.dataset.confirm !== '1'){ t.dataset.confirm = '1'; t.textContent = 'Tap again to disconnect'; return; } saveBridge(null); S.bridge = null; S.txns = []; S.status = 'setup'; S.tab = 'settings'; render(); paintSync(); }
});
function readFxInputs(){
  if (!S.fx) return;
  document.querySelectorAll('[data-fx]').forEach(el => { const f = S.fx[+el.dataset.i]; if (!f) return; const k = el.dataset.fx; if (k === 'active') f.active = el.checked; else if (k === 'amount') f.amount = Math.abs(num(el.value)); else f[k] = el.value; if (k === 'cat') f.type = INCOME_CATS.includes(f.cat) ? 'Pajamos' : 'Islaidos'; });
}
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'rcRev' || id === 'rcCash'){ updateReconLive(); return; }
  if (e.target.dataset.fx){ if (!S.fxDirty){ S.fxDirty = true; readFxInputs(); render(); const el = document.getElementById(id); if (el){ el.focus(); if (el.setSelectionRange && el.type !== 'checkbox' && el.tagName === 'INPUT'){ const n = el.value.length; try { el.setSelectionRange(n, n); } catch(_){} } } } return; }
  if (id === 'wdAmt' || id === 'wdNote'){ if (id === 'wdAmt'){ const c = e.target.value.replace(/[^\d.,]/g, ''); if (c !== e.target.value) e.target.value = c; S.wd.amount = c; } else S.wd.note = e.target.value; return; }
  if (id === 'aAmt'){ const v = e.target.value; const clean = v.replace(/[^\d.,]/g, ''); if (clean !== v) e.target.value = clean; S.add.amount = clean; return; }
  if (e.target.dataset.bud !== undefined){ S.bud.draft[e.target.dataset.bud] = e.target.value.replace(/[^\d.,]/g, ''); S.bud.dirty = true; updateBudgetLive(); return; }
  if (id === 'aNote') S.add.note = e.target.value;
  if (id === 'aVendor'){ S.add.vendor = e.target.value; }
  if (id === 'fQ'){ S.txf.q = e.target.value; clearTimeout(viewTx._t); viewTx._t = setTimeout(() => { render(); const el = $('#fQ'); if (el){ el.focus(); const n = el.value.length; el.setSelectionRange(n, n); } }, 250); }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'aCat'){ S.add.cat = e.target.value; S.add.catTouched = true; render(); }
  else if (id === 'aDate'){ S.add.date = e.target.value || ymd(new Date()); const pk = pkFromDate(S.add.date); ensureBudget(pk); render(); }
  else if (id === 'aVendor'){ S.add.vendor = e.target.value.trim(); if (!S.add.catTouched){ const v = vendorStats().find(x => x.vendor.toLowerCase() === S.add.vendor.toLowerCase()); if (v){ const c = Object.entries(v.cats).sort((a,b) => b[1]-a[1])[0][0]; const isInc = INCOME_CATS.includes(c); if ((S.add.type === 'Pajamos') === isInc){ S.add.cat = c; S.add.vendor = v.vendor; } } } render(); }
  else if (id === 'fPk'){ S.txf.pk = e.target.value; render(); }
  else if (id === 'fCat'){ S.txf.cat = e.target.value; render(); }
  else if (id === 'fType'){ S.txf.type = e.target.value; render(); }
  else if (e.target.dataset.fx){ readFxInputs(); S.fxDirty = true; if (e.target.dataset.fx === 'active' || e.target.dataset.fx === 'cat') render(); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'wdForm'){
    e.preventDefault(); const W = S.wd; W.amount = $('#wdAmt').value; W.date = $('#wdDate').value || ymd(new Date()); W.note = $('#wdNote').value.trim();
    const v = Math.abs(num(W.amount)); if (!(v > 0)){ toast('Enter an amount above zero'); return; }
    const row = {date: W.date, type: 'Pervedimas', cat: SAVINGS, amt: v, note: 'Paimta is Seimos Santaupos' + (W.note ? ': ' + W.note : ''), vendor: 'Seimos Santaupos'};
    guardedWrite('wd', async () => { await appendTxns([row]); S.wd = {open: false, amount: '', date: '', note: ''}; }, fmtE(v) + ' withdrawal recorded');
    return;
  }
  if (e.target.id !== 'addForm') return; e.preventDefault();
  const A = S.add; A.amount = $('#aAmt').value; A.vendor = $('#aVendor').value.trim(); A.note = $('#aNote').value.trim(); A.date = $('#aDate').value; A.cat = $('#aCat').value;
  const v = Math.abs(num(A.amount));
  if (!(v > 0)){ toast('Enter an amount above zero'); $('#aAmt').focus(); return; }
  if (!A.cat){ toast('Choose a category'); $('#aCat').focus(); return; }
  if (!A.date){ toast('Choose a date'); return; }
  const row = {date: A.date, type: A.type, cat: A.cat, amt: A.type === 'Pajamos' ? v : -v, note: A.note, vendor: A.vendor};
  guardedWrite('add', async () => { const r = await appendTxns([row]); S.add = {type: A.type, amount:'', cat:'', vendor:'', date: A.date, note:'', catTouched:false}; return r; }, r => fmtE(row.amt) + ' · ' + row.cat + ' saved to Transakcijos row ' + r);
});
function setTab(tab){ S.tab = tab; try { localStorage.setItem('ff.tab', tab); } catch(e) {} if (tab === 'add') ensureBudget(pkFromDate(S.add.date || ymd(new Date()))); window.scrollTo(0,0); render(); }
$('#pPrev').addEventListener('click', () => { S.pk = pShift(S.pk, -1); ensureBudget(S.pk); render(); });
$('#pNext').addEventListener('click', () => { if (S.pk < curPk()){ S.pk = pShift(S.pk, 1); ensureBudget(S.pk); render(); } });
$('#refresh').addEventListener('click', () => { if (S.mcp || S.bridge) loadAll(); });

// tooltip
const tip = $('#tip');
function hideTip(){ tip.hidden = true; }
document.addEventListener('pointermove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t){ if (!tip.hidden) hideTip(); return; }
  tip.innerHTML = t.dataset.tip; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
});
document.addEventListener('scroll', hideTip, {passive:true});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(afterRender, 150); });

// ---------- Claude review ----------
async function runAI(){
  if (!S.sample || S.ai.busy) return;
  S.ai = {text:'', busy:true, err:''}; render();
  const pks = allPks().filter(p => p <= curPk()).slice(-6);
  const months = pks.map(p => { const a = agg(p); return {month: pLabel(p), inProgress: p === curPk(), income: +a.income.toFixed(2), incomeBySource: a.incByCat, spending: +a.spend.toFixed(2), surplus_saved: +a.surplus.toFixed(2), movedToSavingsAccount: +a.savings.toFixed(2), leftInJointAccount: +a.net.toFixed(2), byGroup: Object.fromEntries(GROUPS.map(g => [g.name, +a.byGroup[g.id].toFixed(2)])), byCategory: Object.fromEntries(Object.entries(a.byCat).map(([k,v]) => [k, +v.toFixed(2)])), transactions: a.n}; });
  const b = budgetFor(S.pk);
  const vendors = {}; S.txns.filter(t => pks.includes(t.pk) && t.type === 'Islaidos' && t.cat !== SAVINGS).forEach(t => { vendors[t.vendor] = (vendors[t.vendor]||0) - t.amt; });
  const topV = Object.entries(vendors).sort((x,y) => y[1]-x[1]).slice(0, 15).map(([k,v]) => [k, +v.toFixed(2)]);
  const prompt = 'You are reviewing a Lithuanian family\'s household finances (two adults, a newborn born July 2026, a dog named Mozza). Financial months run from the 10th to the 9th. Rules: fixed costs post on the 10th; the month\'s surplus moves to the family savings account "Seimos Santaupos" on the 10th. The category "Atsideta i seimos saskaita" is a transfer to savings, NOT spending; surplus = income − spending is what they save. Category names are Lithuanian (Maistas = groceries, Degalai = fuel, Buitiniai = household goods, Restoranai = eating out, Isvaziavimai / atostogos = trips, Dovanos = gifts, Komunaliniai = utilities, Tomo/Ievos = personal allowances, Tecio/Mamos Pinigai = dad\'s/mum\'s income, Vaiko pinigai = child benefit).\n\nDATA (JSON):\n' + JSON.stringify({today: ymd(new Date()), selectedMonth: pLabel(S.pk), months, budgetForSelectedMonth: b ? b.map : null, fixedCostsMonthly: (S.fx || S.fixed).filter(f => f.active).map(f => ({cat: f.cat, vendor: f.vendor, amount: f.amount})), topVendors6mo: topV}) +
    '\n\nWrite a concise review in plain text (no markdown headers, no bold). 6-8 short bullet points starting with "• ". Each bullet: one specific finding with numbers in €, then one concrete action. Cover: trend in spending and savings, categories drifting from budget, anything unusual, the baby-related cost trend, and one idea to raise monthly savings. Be direct; skip generic advice.';
  try {
    await S.sample(prompt, {modelTier:'default', onText: ({text}) => { S.ai.text = text; const o = $('#aiOut'); if (o) o.textContent = text; else render(); }});
  } catch(e){ const c = e && e.code; S.ai.err = c === 'not_granted' ? 'Claude was not allowed for this page.' : c === 'rate_limited' ? 'Too many requests right now. Try again in a minute.' : (e && e.message) || 'Claude could not answer.'; if (e && e.text) S.ai.text = e.text; }
  S.ai.busy = false; render();
}

// ---------- standalone mode (GitHub Pages / installed app) ----------
function loadBridge(){ try { const o = JSON.parse(localStorage.getItem('ff.bridge') || 'null'); return o && o.url && o.key ? o : null; } catch(e){ return null; } }
function saveBridge(o){ try { if (o) localStorage.setItem('ff.bridge', JSON.stringify(o)); else localStorage.removeItem('ff.bridge'); } catch(e){} }
function readSetupHash(){
  const m = location.hash.match(/^#setup=(.+)$/); if (!m) return;
  try { const o = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); if (o.u && o.k){ saveBridge({url: o.u, key: o.k}); S.justLinked = true; } } catch(e) {}
  history.replaceState(null, '', location.pathname + location.search);
}
function setupLink(){ const b = S.bridge; if (!b) return ''; return location.origin + location.pathname + '#setup=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify({u: b.url, k: b.key}))))); }
function viewSettings(){
  const b = S.bridge;
  let h = '';
  if (S.justLinked && b) h += banner('good', 'This phone is connected', 'It reads and writes the same Google Sheet as the other phone. Install it from the browser menu so it opens like an app.');
  if (b){
    h += '<div class="card"><div class="card-h"><h2>Connected to Family Finances 2026</h2><span class="pill good">✓ Sheet bridge</span></div>' +
      '<p class="note">Both phones read and write the same Google Sheet, so they always show the same numbers. The app refreshes when you open it and every 45 seconds while it is open.</p>' +
      '<div><div class="eyebrow" style="margin-bottom:6px">Set up the second phone</div><p class="note" style="margin-bottom:8px">Send this link to the other phone (Messenger, WhatsApp, email) and open it there in Chrome. It contains the access key, so share it only with family.</p>' +
      '<div class="row"><input class="inp num" id="shareLink" readonly value="' + esc(setupLink()) + '" style="flex:1;min-width:0;font-size:.78rem"><button class="btn primary" data-act="copyLink">Copy link</button></div></div>' +
      '<div class="row"><a class="btn ghost sm" href="' + SHEET_URL + '" target="_blank" rel="noopener">Open the Google Sheet ↗</a><span class="spacer"></span><button class="btn sm" data-act="disconnect">Disconnect this phone</button></div></div>';
  } else {
    h += '<div class="card"><div class="card-h"><h2>Connect to your Google Sheet</h2></div>' +
      '<p class="note">If the other phone is already set up, open its setup link here instead (Settings → Copy link on that phone).</p>' +
      '<ol class="note" style="padding-left:18px;display:flex;flex-direction:column;gap:4px;margin:0"><li>In the Family Finances 2026 sheet open <b>Extensions → Apps Script</b> and paste the bridge script.</li><li>Set its KEY, then <b>Deploy → New deployment → Web app</b>, execute as <b>Me</b>, access <b>Anyone</b>.</li><li>Paste the Web app URL and the KEY below.</li></ol></div>';
  }
  h += '<form class="card" id="setupForm" autocomplete="off"><div class="card-h"><h3>' + (b ? 'Change connection' : 'Bridge details') + '</h3></div>' +
    '<label class="f" for="suUrl">Web app URL<input class="inp" id="suUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(b ? b.url : '') + '" required></label>' +
    '<label class="f" for="suKey">Access key<input class="inp num" id="suKey" placeholder="The KEY from Code.gs" value="' + esc(b ? b.key : '') + '" required></label>' +
    (S.setupErr ? '<p class="note neg">' + esc(S.setupErr) + '</p>' : '') +
    '<div class="row"><button class="btn primary" type="submit"' + (S.busy.setup ? ' disabled' : '') + '>' + (S.busy.setup ? 'Checking…' : 'Connect') + '</button>' + (b ? '<button class="btn ghost" type="button" data-tab="now">Back to the app</button>' : '') + '</div></form>';
  h += '<div class="card"><div class="card-h"><h3>Install as an app</h3></div><p class="note"><b>Android (Chrome):</b> menu ⋮ → <b>Install app</b> or <b>Add to Home screen</b>.<br><b>iPhone:</b> Share → <b>Add to Home Screen</b>.<br>It then opens full screen from its own icon.</p></div>';
  return h;
}
let autoSyncOn = false;
function startAutoSync(){
  if (autoSyncOn) return; autoSyncOn = true;
  const tick = () => {
    if (document.hidden || !S.bridge || S.status === 'loading' || S.status === 'refreshing' || S.tab === 'settings') return;
    if (Object.values(S.busy).some(Boolean)) return;
    const a = document.activeElement; if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;
    loadAll().catch(() => {});
  };
  setInterval(tick, 45000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  addEventListener('online', tick);
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'setupForm') return; e.preventDefault();
  const url = $('#suUrl').value.trim(), key = $('#suKey').value.trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)){ S.setupErr = 'Use the Web app URL from Apps Script. It starts with https://script.google.com/macros/s/ and ends with /exec.'; render(); return; }
  const prev = S.bridge; S.bridge = {url, key}; S.busy.setup = true; S.setupErr = ''; render();
  try { await getValues('Transakcijos!A1:G1'); saveBridge(S.bridge); S.busy.setup = false; S.justLinked = true; toast('Connected to Family Finances 2026'); S.tab = 'now'; render(); await loadAll(); startAutoSync(); }
  catch(err){ S.bridge = prev; S.busy.setup = false; const c = errCopy(err); S.setupErr = c.title + '. ' + c.body; render(); }
});

// ---------- boot ----------
S.pk = curPk();
paintHeader();
(async () => {
  const cl = window.claude;
  if (!cl || !cl.use){
    readSetupHash(); S.bridge = loadBridge(); S.sample = null;
    const g = $('#gear'); if (g) g.hidden = false;
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(r => r.update()).catch(() => {});
    if (!S.bridge){ S.status = 'setup'; S.tab = 'settings'; render(); paintSync(); return; }
    if (S.justLinked) S.tab = 'settings';
    await loadAll(); startAutoSync(); return;
  }
  cl.use('sample').then(s => { S.sample = s; if (S.tab === 'analytics') render(); }).catch(() => {});
  const m = await cl.use('mcp').catch(() => null);
  if (!m){ S.status = 'nomcp'; render(); paintSync(); return; }
  S.mcp = m;
  try { await loadAll(); } catch(e){ S.status = 'error'; S.err = e; render(); paintSync(); }
})();
})();
</script>
